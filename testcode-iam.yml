AWSTemplateFormatVersion: '2010-09-09'
Description: 'CloudFormation template to create an IAM User with an inline policy'

Resources:
  MyIAMUser:
    Type: 'AWS::IAM::User'
    Properties:
      UserName: 'AppDeveloperUser'
      Path: '/'
      Policies:
        - PolicyName: 'S3ReadOnlyAndEC2Describe'
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: 'Allow'
                Action:
                  - 's3:GetObject'
                  - 's3:ListBucket'
                Resource: '*'
              